
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVT Stickers</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 24px 18px;
  border-bottom: 1px solid #252525;
}

.logo {
  font-size: 32px;
  letter-spacing: 8px;
  font-weight: bold;
}

.subtitle {
  color: #888;
  font-size: 11px;
  margin-top: 5px;
  letter-spacing: 3px;
}

.hero {
  padding: 45px 20px 30px;
}

.hero h1 {
  font-size: 34px;
  margin-bottom: 12px;
}

.hero p {
  color: #999;
  line-height: 1.6;
}

.search {
  margin-top: 25px;
  width: 100%;
  padding: 15px;
  border: 1px solid #333;
  background: #141414;
  color: white;
  border-radius: 10px;
  font-size: 15px;
}

.section {
  padding: 20px;
}

.section h2 {
  margin-bottom: 18px;
  font-size: 20px;
}

.categories {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.category {
  background: #191919;
  border: 1px solid #333;
  padding: 11px 17px;
  border-radius: 20px;
  color: #ddd;
  font-size: 13px;
}

.empty {
  text-align: center;
  padding: 45px 15px;
  border: 1px dashed #333;
  border-radius: 12px;
  color: #888;
  margin-top: 20px;
}

footer {
  text-align: center;
  color: #666;
  padding: 35px 15px;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">𝑺 𝑽 𝑻</div>
  <div class="subtitle">STICKER COLLECTION</div>
</header>

<div class="hero">
  <h1>Discover Stickers.</h1>
  <p>Your favourite stickers, all in one place.<br>
  Explore. Collect. Download. For free.</p>

  <input class="search"
  type="search"
  placeholder="Search stickers...">
</div>

<div class="section">
  <h2>Categories</h2>
  <div class="categories">
    <div class="category">Anime</div>
    <div class="category">Memes</div>
    <div class="category">Funny</div>
    <div class="category">Cute</div>
    <div class="category">Aesthetic</div>
    <div class="category">WhatsApp</div>
  </div>
</div>

<div class="section">
  <h2>Latest Stickers</h2>
  <div class="empty">
    <p>No stickers yet.</p>
    <p>New collections coming soon.</p>
  </div>
</div>

<footer>
  © 2026 SVT Stickers · All Rights Reserved
</footer>

</body>
</html>
